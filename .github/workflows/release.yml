name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Machines deploy the release branch, so `make release` only moves it to a commit that passes `make check`.
  # One run at a time, and a run queued behind another replaces any already waiting, so each
  # run releases main as it is when the run starts, not the commit that queued it: a replaced
  # run's commit is then released by the run that replaced it.
  release:
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.released.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # The system tests boot the hosts in QEMU, under KVM, with the firmware
      # descriptors the ovmf package installs; pytest runs in a venv.
      - name: Install QEMU for the system tests
        run: |
          sudo apt-get update -q
          sudo apt-get install -qy --no-install-recommends qemu-system-x86 qemu-utils ovmf python3-venv

      - name: Enable KVM for the system tests
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: cachix/install-nix-action@v31

      - run: make release

      - id: released
        run: echo "sha=$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"

  # The self-installing ISO for each host, built from the commit just released. It holds no
  # secrets, so it is safe as a public artifact.
  iso:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.sha }}
      - uses: cachix/install-nix-action@v31
      - run: make isos
      - uses: actions/upload-artifact@v4
        with:
          name: installer-isos
          path: out/*.iso
          compression-level: 0
