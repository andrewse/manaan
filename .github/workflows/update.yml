name: update

on:
  schedule:
    - cron: "0 18 * * 0" # Monday 05:00 Sydney
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Machines only deploy a release signed by an admin, and this job can't sign, so
  # `make update` checks the new flake.lock and pushes it to the flake-update branch
  # as a proposal, never to main or release. Its own concurrency group: it doesn't
  # touch what release.yml does, and a later run only replaces the proposal.
  update:
    runs-on: ubuntu-latest
    concurrency: update
    permissions:
      contents: write
    env:
      GIT_AUTHOR_NAME: github-actions[bot]
      GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      GIT_COMMITTER_NAME: github-actions[bot]
      GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # The system tests boot the hosts in QEMU, under KVM, with the firmware
      # descriptors the ovmf package installs; pytest runs in a venv.
      - name: Install QEMU for the system tests
        run: |
          sudo apt-get update -q
          sudo apt-get install -qy --no-install-recommends qemu-system-x86 qemu-utils ovmf python3-venv

      - name: Enable KVM for the system tests
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: cachix/install-nix-action@v31

      - run: make update
